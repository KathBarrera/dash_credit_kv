# Mantiene despierto el tablero en Render (el plan gratis lo apaga tras 15 minutos sin visitas).
#
# GitHub no respeta el cron al minuto: en repos con poca actividad los "*/10" llegan cada varias horas.
# Por eso cada ejecución se queda viva ~5 h 50 min visitando /health cada 9 minutos, y el grupo de
# "concurrency" deja la siguiente ejecución en cola: cuando una termina, la otra arranca de inmediato.
# Así siempre hay un job haciendo ping aunque GitHub retrase los disparos programados.
#
# La URL se toma de la variable del repositorio RENDER_URL
# (Settings > Secrets and variables > Actions > Variables); si no existe, usa la de abajo.
# Lo ideal es sumar además un monitor externo (UptimeRobot o cron-job.org); ver el README.
name: Mantener despierto el tablero

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: mantener-despierto
  cancel-in-progress: false   # no corta la ejecución activa; la nueva espera en cola y la releva

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # límite de GitHub: 6 h por job
    steps:
      - name: Visitar /health cada 9 minutos durante ~5 h 50 min
        env:
          URL: ${{ vars.RENDER_URL || 'https://dash-credit-kv.onrender.com' }}
        run: |
          base="${URL%/}"
          fin=$(( $(date +%s) + 350 * 60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            ok=0
            for i in 1 2 3; do
              if curl -fsS --max-time 90 "$base/health"; then echo " · $(date -u +%H:%M) despierto"; ok=1; break; fi
              echo "Intento $i falló; reintento en 20 s"; sleep 20
            done
            [ "$ok" = 1 ] || echo "No respondió (puede estar arrancando); sigo intentando"
            sleep 540
          done
          echo "Fin del turno; la siguiente ejecución en cola toma el relevo"
