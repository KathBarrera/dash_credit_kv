# Visita el tablero en Render cada 10 minutos para que el plan gratis no lo duerma
# (Render lo apaga tras 15 minutos sin visitas).
# La URL se toma de la variable del repositorio RENDER_URL
# (Settings > Secrets and variables > Actions > Variables); si no existe, usa la de abajo.
name: Mantener despierto el tablero

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visitar /ping
        env:
          URL: ${{ vars.RENDER_URL || 'https://dash-credit-kv.onrender.com' }}
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "${URL%/}/ping"; then echo; echo "Despierto"; exit 0; fi
            echo "Intento $i falló; reintento en 20 s"; sleep 20
          done
          echo "No respondió (puede estar arrancando)"; exit 1
